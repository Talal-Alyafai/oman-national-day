<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oman National Day · العيد الوطني العُماني</title>

<meta property="og:description" content="Design a greeting card, frame your photo, explore thousands of years of Omani history, take the quiz and leave a wish for Oman.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============ CONFIG-FREE THEME TOKENS ============ */
:root{
  --red:#C8102E; --red-d:#9E0B23; --green:#007A3D; --green-d:#00552A;
  --sand:#F7F1E6; --sand-2:#EFE5D2; --ink:#1E1A16; --muted:#6B6158;
  --card:#FFFFFF; --line:#E4D9C6; --gold:#B88A2E;
  --radius:18px; --shadow:0 10px 30px rgba(60,40,10,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--sand);color:var(--ink);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.kufi{font-family:"Reem Kufi","Tajawal",sans-serif}
button,input,select,textarea{font-family:inherit;font-size:1rem}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- tri-colour ribbon ---------- */
/* Omani flag order: red hoist band, then white / red / green horizontal stripes */
.ribbon{height:12px;background:linear-gradient(var(--red),var(--red)) left center/90px 100% no-repeat,linear-gradient(#fff 0 33.34%,var(--red) 33.34% 66.67%,var(--green) 66.67%)}
[dir=rtl] .ribbon{background-position:right center,0 0}

/* ---------- nav ---------- */
header.nav{position:sticky;top:0;z-index:50;background:rgba(247,241,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center}
.nav-links{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:500;color:var(--muted);white-space:nowrap;font-size:.95rem}
.nav-links a:hover{background:var(--sand-2);color:var(--ink)}
.lang-btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
@media(max-width:860px){.nav-links{display:none}.lang-btn{margin-inline-start:auto}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--green-d);color:#fff;padding:72px 0 88px}
.hero-pattern{position:absolute;inset:0;opacity:.10;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.2;margin:18px 0 14px}
.hero h1 span{color:#FFD9DF}
.hero p.sub{font-size:1.15rem;opacity:.88;max-width:560px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-white{background:#fff;color:var(--green-d)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--sand-2)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-d)}
.btn svg{width:18px;height:18px}

.countdown-box{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:28px}
.countdown-box h3{font-size:1.05rem;font-weight:500;opacity:.85;margin-bottom:16px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.cd div{background:#fff;color:var(--ink);border-radius:14px;padding:14px 4px;text-align:center}
.cd b{display:block;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.cd small{font-size:.8rem;color:var(--muted);font-weight:700}
.cd-done{display:none;font-family:"Reem Kufi";font-size:1.8rem;text-align:center;padding:12px 0}
.fact{margin-top:20px;padding-top:18px;border-top:1px dashed rgba(255,255,255,.25);min-height:84px}
.fact small{opacity:.7;font-weight:700;letter-spacing:.02em}
.fact p{font-size:1.05rem;transition:opacity .4s}

/* ---------- sections ---------- */
section.block{padding:80px 0}
section.alt{background:#fff}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.sec-head .num{font-family:"Reem Kufi";color:var(--red);font-weight:700;font-size:.95rem}
.sec-head h2{font-size:clamp(1.7rem,3.5vw,2.4rem);line-height:1.25}
.sec-head p{color:var(--muted);max-width:520px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
section.alt .panel{background:var(--sand)}
.studio{display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}
@media(max-width:900px){.studio{grid-template-columns:1fr}}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px}
.field input[type=text],.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.92rem}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.tpl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpl{aspect-ratio:1;border-radius:12px;border:2.5px solid transparent;cursor:pointer;overflow:hidden;padding:0;background:#ddd}
.tpl.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.18)}
.tpl canvas{width:100%;height:100%;display:block}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.preview{display:flex;justify-content:center;align-items:center;background:var(--sand-2);border-radius:var(--radius);padding:24px;min-height:420px}
section.alt .preview{background:var(--sand-2)}
.preview canvas{max-width:100%;max-height:640px;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.18);touch-action:none}
.hint{font-size:.85rem;color:var(--muted);margin-top:8px}
input[type=range]{width:100%;accent-color:var(--red)}
.upload{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:#fff;display:block}
.upload:hover{border-color:var(--green)}
.upload svg{width:34px;height:34px;color:var(--green);margin-bottom:6px}

/* ---------- Al Busaidi spotlight ---------- */
.spot{display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:36px;align-items:center;background:var(--green-d);color:#fff;border-radius:24px;padding:28px;margin-bottom:40px;position:relative;overflow:hidden}
.spot .pattern{position:absolute;inset:0;opacity:.07;pointer-events:none}
.spot figure{position:relative;margin:0}
.spot img{width:100%;display:block;border-radius:16px;border:3px solid #E9C46A;box-shadow:0 20px 40px rgba(0,0,0,.35);cursor:zoom-in;transition:transform .3s}
.spot img:hover{transform:scale(1.015)}
.spot figcaption{font-size:.85rem;opacity:.7;margin-top:10px;text-align:center}
.spot .txt{position:relative}
.spot .since{display:inline-block;background:var(--red);color:#fff;font-family:"Reem Kufi";font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px}
.spot h3{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.2;margin-bottom:14px}
.spot p{opacity:.9;font-size:1.08rem;margin-bottom:12px}
.spot .gold{color:#E9C46A;font-weight:700}
@media(max-width:800px){.spot{grid-template-columns:1fr;padding:20px;gap:22px}}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(10,8,5,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* ---------- history timeline ---------- */
.tl{position:relative;max-width:980px;margin:0 auto;padding:10px 0}
.tl:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;border-radius:4px;
  background:linear-gradient(#fff 0 33.34%,var(--red) 33.34% 66.67%,var(--green) 66.67%);box-shadow:0 0 0 1px var(--line)}
.ev{position:relative;width:50%;padding:10px 44px;opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
.ev.in{opacity:1;transform:none}
.ev:nth-child(odd){margin-inline-start:0;text-align:end}
.ev:nth-child(even){margin-inline-start:50%}
[dir=ltr] .ev:nth-child(odd){text-align:right}[dir=ltr] .ev:nth-child(even){text-align:left}
[dir=rtl] .ev:nth-child(odd){text-align:left}[dir=rtl] .ev:nth-child(even){text-align:right}
.ev .dot{position:absolute;top:30px;width:22px;height:22px;background:#fff;border:4px solid var(--red);border-radius:50%;transform:rotate(45deg);border-radius:5px}
[dir=ltr] .ev:nth-child(odd) .dot,[dir=rtl] .ev:nth-child(even) .dot{right:-11px}
[dir=ltr] .ev:nth-child(even) .dot,[dir=rtl] .ev:nth-child(odd) .dot{left:-11px}
.ev .box{display:inline-block;text-align:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);max-width:420px}
.ev .yr{font-family:"Reem Kufi";color:var(--red);font-size:1.7rem;font-weight:700;line-height:1.1}
.ev h3{font-size:1.15rem;margin:6px 0 4px}
.ev p{color:var(--muted);font-size:.95rem}
.ev.key .box{background:var(--green-d);border-color:var(--green-d);color:#fff}
.ev.key .yr{color:#FFD9DF}.ev.key p{color:rgba(255,255,255,.82)}
.ev.key .dot{border-color:var(--green);background:var(--red)}
@media(max-width:760px){
  .tl:before{left:14px;margin:0}[dir=rtl] .tl:before{left:auto;right:14px}
  .ev,.ev:nth-child(even){width:100%;margin-inline-start:0;padding-block:8px;padding-inline:44px 0;text-align:start!important}
  .ev .dot,.ev:nth-child(odd) .dot,.ev:nth-child(even) .dot{left:4px!important;right:auto!important}
  [dir=rtl] .ev .dot,[dir=rtl] .ev:nth-child(odd) .dot,[dir=rtl] .ev:nth-child(even) .dot{right:4px!important;left:auto!important}
  .ev .box{display:block}
}
.order{margin-bottom:46px}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.order-head h3{font-size:1.35rem}
.order-list{display:grid;gap:10px;margin:16px 0}
.oitem{display:flex;align-items:center;gap:14px;text-align:start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:1.02rem;transition:all .15s}
.oitem:hover:not(:disabled){border-color:var(--green)}
.oitem .badge{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sand-2);color:var(--muted);font-family:"Reem Kufi";font-size:1.1rem}
.oitem.picked .badge{background:var(--red);color:#fff}
.oitem.picked{border-color:var(--red)}
.oitem .yr{margin-inline-start:auto;font-family:"Reem Kufi";color:var(--green);display:none;white-space:nowrap}
.oitem.ok{border-color:var(--green);background:#F1FAF4}.oitem.ok .badge{background:var(--green)}
.oitem.bad{border-color:var(--red);background:#FFF5F6}
.oitem.ok .yr,.oitem.bad .yr{display:block}
.oitem:disabled{cursor:default;color:var(--ink)}
.order-result{font-weight:800;font-size:1.1rem;min-height:1.6em}

/* ---------- quiz ---------- */
.quiz-wrap{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:900px){.quiz-wrap{grid-template-columns:1fr}}
.quiz-card{min-height:420px;display:flex;flex-direction:column}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;color:var(--muted)}
.timer{height:8px;background:var(--sand-2);border-radius:999px;overflow:hidden;margin-bottom:22px}
.timer i{display:block;height:100%;background:var(--green);width:100%}
.q-text{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:800;margin-bottom:22px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:start;cursor:pointer;font-weight:700;font-size:1.05rem;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--green);transform:translateY(-2px)}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--sand-2);display:none}
.explain.show{display:block;animation:pop .25s}
.q-foot{margin-top:auto;padding-top:18px;display:flex;justify-content:flex-end}
.quiz-start{text-align:center;margin:auto;max-width:420px}
.quiz-start .big{font-family:"Reem Kufi";font-size:4rem;color:var(--red);line-height:1}
.board h3{margin-bottom:12px}
.board ol{list-style:none;display:grid;gap:8px}
.board li{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.board li b{color:var(--red)}
.board .empty{color:var(--muted);font-size:.92rem}

/* ---------- wishes ---------- */
.wish-form{display:grid;grid-template-columns:200px 1fr auto;gap:10px;margin-bottom:26px}
@media(max-width:700px){.wish-form{grid-template-columns:1fr}}
.wish-form input{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;background:#fff}
.wish-form input:focus{border-color:var(--green)}
.wishes{columns:3 260px;column-gap:14px}
.wish{break-inside:avoid;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;border-top:5px solid var(--red);animation:pop .35s}
.wish:nth-child(3n+2){border-top-color:var(--green)}
.wish:nth-child(3n){border-top-color:var(--gold)}
.wish p{font-size:1.08rem;font-weight:500;margin-bottom:10px}
.wish footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88rem}
.like{border:0;background:var(--sand);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-weight:700;color:var(--red)}
.like svg{width:15px;height:15px}
.present{position:fixed;inset:0;z-index:120;background:var(--green-d);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
.present.open{display:flex}
.present .q{font-family:"Reem Kufi";font-size:clamp(2rem,5.5vw,4.4rem);line-height:1.35;max-width:1100px;transition:opacity .5s}
.present .who{margin-top:26px;font-size:1.4rem;opacity:.8;transition:opacity .5s}
.present .close{position:absolute;top:22px;inset-inline-end:22px}
.present .pattern{position:absolute;inset:0;opacity:.08;pointer-events:none}
.present .ribbon{position:absolute;top:0;left:0;right:0;height:18px}

footer.site{background:var(--ink);color:#d9d2c7;padding:36px 0;text-align:center}
footer.site b{color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;z-index:200;transition:transform .3s,visibility .3s;font-weight:500;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
</style>
</head>
<body>

<!-- ===== reusable SVG defs ===== -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="stars" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff" stroke-width="1.5">
        <rect x="22" y="22" width="36" height="36"/>
        <rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
        <circle cx="40" cy="40" r="6"/>
        <path d="M0 0L12 12M80 0L68 12M0 80L12 68M80 80L68 68"/>
      </g>
    </pattern>
  </defs>
</svg>

<div class="ribbon"></div>
<header class="nav">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="6" y="6" width="12" height="12"/><rect x="6" y="6" width="12" height="12" transform="rotate(45 12 12)"/></svg>
      </div>
      <span data-t="brandTitle"></span>
    </div>
    <nav class="nav-links">
      <a href="#card" data-t="navCard"></a>
      <a href="#frame" data-t="navFrame"></a>
      <a href="#history" data-t="navHist"></a>
      <a href="#quiz" data-t="navQuiz"></a>
      <a href="#wishes" data-t="navWish"></a>
    </nav>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<!-- ===== HERO ===== -->
<section class="hero" id="top">
  <svg class="hero-pattern" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#stars)"/></svg>
  <div class="wrap">
    <div>
      <span class="kicker"><i></i><span data-t="heroKicker"></span></span>
      <h1 data-t="heroTitle"></h1>
      <p class="sub" data-t="heroSub"></p>
      <div class="hero-ctas">
        <a href="#card" class="btn btn-red" data-t="ctaCard"></a>
        <a href="#quiz" class="btn btn-white" data-t="ctaQuiz"></a>
      </div>
    </div>
    <div class="countdown-box">
      <h3 data-t="cdTitle"></h3>
      <div class="cd" id="cd">
        <div><b id="cdD">00</b><small data-t="days"></small></div>
        <div><b id="cdH">00</b><small data-t="hours"></small></div>
        <div><b id="cdM">00</b><small data-t="mins"></small></div>
        <div><b id="cdS">00</b><small data-t="secs"></small></div>
      </div>
      <div class="cd-done" id="cdDone" data-t="cdDone"></div>
      <div class="fact">
        <small data-t="didYouKnow"></small>
        <p id="factText"></p>
      </div>
    </div>
  </div>
</section>
<div class="ribbon"></div>

<!-- ===== CARD MAKER ===== -->
<section class="block" id="card">
  <div class="wrap">
    <div class="sec-head">

/* ---------- confetti in flag colours ---------- */
const conf = { cv:$("#confetti"), parts:[], running:false };
function confetti(){
  const cv = conf.cv, ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#C8102E","#007A3D","#FFFFFF","#B88A2E"];
  for(let i=0;i<160;i++) conf.parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[i%4]});
  if(conf.running) return; conf.running = true;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    conf.parts = conf.parts.filter(p => p.y < cv.height+30);
    conf.parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.strokeStyle="rgba(0,0,0,.15)";
      ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(conf.parts.length) requestAnimationFrame(loop); else { conf.running=false; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}

/* ---------- canvas drawing primitives ---------- */
function star8(ctx, x, y, r){
  ctx.beginPath();
  for(let i=0;i<16;i++){ const a = i*Math.PI/8 - Math.PI/2; const rr = i%2 ? r*0.62 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath();
}
function starField(ctx, W, H, step, color, alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 2;
  for(let y=step/2; y<H+step; y+=step) for(let x=(Math.round(y/step)%2? step : step/2); x<W+step; x+=step){ star8(ctx,x,y,step*0.28); ctx.stroke(); }
  ctx.restore();
}
/* Omani flag order: red hoist block + white / red / green stacked stripes */
function triRibbon(ctx, x, y, w, h){
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(x,y,w,h/3);
  ctx.fillStyle="#C8102E"; ctx.fillRect(x,y+h/3,w,h/3);
  ctx.fillStyle="#007A3D"; ctx.fillRect(x,y+2*h/3,w,h/3);
  ctx.fillStyle="#C8102E"; ctx.fillRect(x,y,Math.max(h*1.4, w*0.08),h);
}
/* generic crenellated fort silhouette */
function fort(ctx, W, baseY, color){
  ctx.fillStyle = color; ctx.beginPath();
  const m = 34; // merlon size
  ctx.moveTo(0, baseY+200);
  // left round tower
  const tw = W*0.18, th = 230;
  ctx.lineTo(0, baseY-th);
  for(let x=0; x<tw; x+=m*2){ ctx.lineTo(x, baseY-th-m); ctx.lineTo(x+m, baseY-th-m); ctx.lineTo(x+m, baseY-th); ctx.lineTo(Math.min(x+m*2,tw), baseY-th); }
  ctx.lineTo(tw, baseY-120);
  // wall
  const rw = W-tw;
  for(let x=tw; x<rw; x+=m*2){ ctx.lineTo(x, baseY-120-m*.8); ctx.lineTo(x+m, baseY-120-m*.8); ctx.lineTo(x+m, baseY-120); ctx.lineTo(Math.min(x+m*2,rw), baseY-120); }
  // right tower
  ctx.lineTo(rw, baseY-th);
  for(let x=rw; x<W; x+=m*2){ ctx.lineTo(x, baseY-th-m); ctx.lineTo(x+m, baseY-th-m); ctx.lineTo(x+m, baseY-th); ctx.lineTo(Math.min(x+m*2,W), baseY-th); }
  ctx.lineTo(W, baseY+200); ctx.closePath(); ctx.fill();
  // gate
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); const gx=W/2, gw=90; ctx.moveTo(gx-gw/2, baseY+200); ctx.lineTo(gx-gw/2, baseY-10); ctx.arc(gx, baseY-10, gw/2, Math.PI, 0); ctx.lineTo(gx+gw/2, baseY+200); ctx.fill();
}
function wrapLines(ctx, text, maxW){
  const words = text.split(" "); const lines=[]; let cur="";
  words.forEach(w => { const test = cur ? cur+" "+w : w; if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur=w; } else cur=test; });
  if(cur) lines.push(cur); return lines;
}
function fitText(ctx, text, maxW, maxLines, startSize, weight, family){
  let size = startSize, lines;
  do { ctx.font = `${weight} ${size}px ${family}`; lines = wrapLines(ctx, text, maxW); size -= 4; }
  while((lines.length > maxLines || lines.some(l => ctx.measureText(l).width > maxW)) && size > 24);
  return {lines, size:size+4};
}
function setDir(ctx, text){ ctx.direction = isAr(text) ? "rtl" : "ltr"; }

   1. COUNTDOWN + FACTS
   ===================================================================== */
function nextNationalDay(){
  // all times in Oman (UTC+4)
  const now = Date.now();
  const y = new Date(now + 4*3600e3).getUTCFullYear();
  const mk = yr => Date.UTC(yr, NATIONAL_DAY.month-1, NATIONAL_DAY.day) - 4*3600e3;
  let start = mk(y);
  if(now >= start + 86400e3) start = mk(y+1);
  return start;
}
let celebrated = false;
function tick(){
  const start = nextNationalDay(), now = Date.now();
  if(now >= start){
    $("#cd").style.display="none"; $("#cdDone").style.display="block";
    if(!celebrated){ celebrated = true; setTimeout(confetti, 600); }
    return;
  }
  let d = Math.floor((start-now)/1000);
  const pad = n => String(n).padStart(2,"0");
  $("#cdD").textContent = pad(Math.floor(d/86400)); d%=86400;
  $("#cdH").textContent = pad(Math.floor(d/3600)); d%=3600;
  $("#cdM").textContent = pad(Math.floor(d/60));
  $("#cdS").textContent = pad(d%60);
}
let factIdx = Math.floor(Math.random()*FACTS.length);
function showFact(){
  const f = FACTS[factIdx % FACTS.length], p = $("#factText");
  p.style.opacity = 0;
  setTimeout(()=>{ p.textContent = `${f.g[LANG]}: ${f[LANG]}`; p.style.opacity = 1; }, 350);
}
setInterval(tick, 1000);
setInterval(()=>{ factIdx++; showFact(); }, 7000);

/* =====================================================================
   2. CARD MAKER
   ===================================================================== */
const TEMPLATES = ["flag","night","fort","minimal"];
const cardState = { tpl:"flag", msg:0, fmt:"square" };

function drawCard(ctx, W, H, tpl, opts){
  const {message, to, from} = opts;
  const ar = isAr(message);
  const kufi = '"Reem Kufi","Tajawal",sans-serif', taj = '"Tajawal",sans-serif';
  let fg = "#1E1A16", accent = "#C8102E", sub = "#6B6158";
  ctx.save(); ctx.clearRect(0,0,W,H);

  if(tpl==="flag"){
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,W,H);
    starField(ctx,W,H,120,"#007A3D",.07);
    triRibbon(ctx,0,0,W,H*0.06);
    triRibbon(ctx,0,H*0.94,W,H*0.06);
    // side band
    ctx.fillStyle="#C8102E"; ctx.fillRect(ar? W-W*0.05 : 0, H*0.06, W*0.05, H*0.88);
  } else if(tpl==="night"){
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#00552A"); g.addColorStop(1,"#002A15");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    starField(ctx,W,H,110,"#E9C46A",.22);
    ctx.strokeStyle="#E9C46A"; ctx.lineWidth=4; ctx.strokeRect(40,40,W-80,H-80);
    ctx.lineWidth=1.5; ctx.strokeRect(56,56,W-112,H-112);
    fg="#FFFFFF"; accent="#E9C46A"; sub="rgba(255,255,255,.75)";
  } else if(tpl==="fort"){
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#F9E7C8"); g.addColorStop(1,"#E8B97A");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(W*0.5,H*0.78,W*0.32,0,Math.PI*2); ctx.fill();
    fort(ctx, W, H*0.86, "#8A3B12");
    triRibbon(ctx,0,0,W,H*0.035);
    fg="#3B1A08"; accent="#C8102E"; sub="#7A4B2A";
  } else { // minimal
    ctx.fillStyle="#F7F1E6"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#C8102E"; star8(ctx, W/2, H*0.2, 54); ctx.fill();
    ctx.fillStyle="#F7F1E6"; star8(ctx, W/2, H*0.2, 22); ctx.fill();
    ctx.strokeStyle="#D9CDB8"; ctx.lineWidth=2; ctx.strokeRect(W*0.36,H*0.875,W*0.28,27);
    triRibbon(ctx,W*0.36,H*0.875,W*0.28,27);
  }

  // text block
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const cx = W/2;
  const centerY = tpl==="fort" ? H*0.38 : H*0.5;
  const kicker = ar ? T.natDay.ar : T.natDay.en;
  setDir(ctx, kicker);
  ctx.fillStyle = accent; ctx.font = `700 ${Math.round(W*0.036)}px ${ar?kufi:taj}`;
  if(!ar) ctx.letterSpacing = "6px";
  const fitted = fitText(ctx, message, W*0.78, H>W?4:3, Math.round(W*0.12), 700, ar?kufi:taj);
  const lh = fitted.size*1.35, blockH = fitted.lines.length*lh;
  const topY = centerY - blockH/2;
  ctx.font = `700 ${Math.round(W*0.036)}px ${ar?kufi:taj}`;
  ctx.fillText(kicker, cx, topY - W*0.09);
  ctx.letterSpacing = "0px";
  // small date chip under kicker
  ctx.fillStyle = sub; ctx.font = `500 ${Math.round(W*0.028)}px ${taj}`; ctx.direction = "ltr";
  ctx.fillText(ar ? "٢٠ نوفمبر" : "20 November", cx, topY - W*0.045);

  setDir(ctx, message);
  ctx.fillStyle = fg; ctx.font = `700 ${fitted.size}px ${ar?kufi:taj}`;
  fitted.lines.forEach((l,i)=> ctx.fillText(l, cx, topY + lh/2 + i*lh));

  let y = topY + blockH + W*0.06;
  if(to){ ctx.direction = ar?"rtl":"ltr"; ctx.fillStyle=sub; ctx.font=`500 ${Math.round(W*0.036)}px ${taj}`; ctx.fillText(`${ar?T.to.ar:T.to.en}: ${to}`, cx, y); y += W*0.055; }
  if(from){ ctx.direction = ar?"rtl":"ltr"; ctx.fillStyle=accent; ctx.font=`700 ${Math.round(W*0.04)}px ${taj}`; ctx.fillText(`${ar?T.from.ar:T.from.en}: ${from}`, cx, y); y += W*0.055; }
  ctx.restore();
}

function currentMessage(sel, customInput){
  const v = sel.value;
  if(v==="custom") return (customInput && customInput.value.trim()) || (LANG==="ar" ? "كل عام وعُمان بخير" : "Happy National Day, Oman");
  const m = MESSAGES[+v]; return m.ar || m.en;
}
function fillMsgSelect(sel, withCustom){
  const keep = sel.value;
  sel.innerHTML = MESSAGES.map((m,i)=>`<option value="${i}">${m.ar||m.en}</option>`).join("") + (withCustom?`<option value="custom">${t("customOpt")}</option>`:"");
  sel.value = keep || (LANG==="ar" ? "0" : "5");
}
function renderCard(){
  const cv = $("#cardCanvas"), W=1080, H = cardState.fmt==="story"?1920:1080;
  cv.width=W; cv.height=H;
  $("#customWrap").style.display = $("#cMsg").value==="custom" ? "block" : "none";
  drawCard(cv.getContext("2d"), W, H, cardState.tpl, {
    message: currentMessage($("#cMsg"), $("#cCustom")),
    to: $("#cTo").value.trim(), from: $("#cFrom").value.trim()
  });
}
function renderThumbs(){
  const row = $("#tplRow"); row.innerHTML="";
  TEMPLATES.forEach(tp => {
    const b = document.createElement("button"); b.className = "tpl"+(tp===cardState.tpl?" on":""); b.setAttribute("aria-label", tp);
    const c = document.createElement("canvas"); c.width=c.height=540; b.appendChild(c); row.appendChild(b);
    const ctx = c.getContext("2d"); ctx.scale(.5,.5);
    drawCard(ctx,1080,1080,tp,{message: LANG==="ar"?"عيد وطني":"National Day"});
    b.onclick = ()=>{ cardState.tpl=tp; $$(".tpl").forEach(x=>x.classList.remove("on")); b.classList.add("on"); renderCard(); };
  });
}

/* download & share */
function downloadCanvas(cv, name){
  cv.toBlob(b => { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast(t("saved")); }, "image/png");
}
function shareCanvas(cv, name, text){
  cv.toBlob(async b => {
    const file = new File([b], name, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], text}); } catch(e){}
    } else {
      downloadCanvas(cv, name);
      window.open("https://wa.me/?text="+encodeURIComponent(text), "_blank");
    }
  }, "image/png");
}

function renderFrame(){
  const cv = $("#frameCanvas"), ctx = cv.getContext("2d"), W=1080, H=1080;
  const taj='"Tajawal",sans-serif', kufi='"Reem Kufi","Tajawal",sans-serif';
  ctx.clearRect(0,0,W,H);
  // photo area depends on style
  const inset = frame.style==="border" ? 70 : 0;
  ctx.save(); ctx.beginPath(); ctx.rect(inset,inset,W-inset*2,H-inset*2); ctx.clip();
  if(frame.img){
    const iw=frame.img.width, ih=frame.img.height, aw=W-inset*2, ah=H-inset*2;
    const s = Math.max(aw/iw, ah/ih)*frame.zoom;
    const dw=iw*s, dh=ih*s;
    const maxX=(dw-aw)/2, maxY=(dh-ah)/2;
    frame.ox=Math.max(-maxX,Math.min(maxX,frame.ox)); frame.oy=Math.max(-maxY,Math.min(maxY,frame.oy));
    ctx.drawImage(frame.img, inset+(aw-dw)/2+frame.ox, inset+(ah-dh)/2+frame.oy, dw, dh);
  } else {
    ctx.fillStyle="#E9DFCC"; ctx.fillRect(0,0,W,H);
    starField(ctx,W,H,120,"#007A3D",.12);
    ctx.fillStyle="#6B6158"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.direction = LANG==="ar"?"rtl":"ltr";
    ctx.font=`700 46px ${taj}`; ctx.fillText(t("framePlaceholder"), W/2, H*0.4);
  }
  ctx.restore();

  const message = currentMessage($("#fMsg"));
  const ar = isAr(message), name = $("#fName").value.trim();
  ctx.textAlign="center"; ctx.textBaseline="middle";

  if(frame.style==="banner"){
    const g=ctx.createLinearGradient(0,H*0.55,0,H); g.addColorStop(0,"rgba(0,40,20,0)"); g.addColorStop(1,"rgba(0,40,20,.92)");
    ctx.fillStyle=g; ctx.fillRect(0,H*0.55,W,H*0.45);
    triRibbon(ctx,0,H-24,W,24);
    ctx.fillStyle="#fff"; setDir(ctx,message);
    const f = fitText(ctx,message,W*0.86,2,78,700,ar?kufi:taj);
    const lh=f.size*1.3; const base = H - 90 - (name?50:0) - (f.lines.length-1)*lh;
    ctx.font=`700 ${f.size}px ${ar?kufi:taj}`;
    f.lines.forEach((l,i)=>ctx.fillText(l, W/2, base+i*lh));
    ctx.font=`700 30px ${ar?kufi:taj}`; ctx.fillStyle="#FFD9DF"; const k = ar?T.natDay.ar:T.natDay.en; setDir(ctx,k);
    ctx.fillText(k+"  ·  "+(ar?"٢٠ نوفمبر":"20 November"), W/2, base - f.size*0.95);
    if(name){ ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font=`500 38px ${taj}`; setDir(ctx,name); ctx.fillText(name, W/2, H-78); }
  }
  else if(frame.style==="border"){
    ctx.fillStyle="#FFFFFF";
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(inset,inset,W-inset*2,H-inset*2); ctx.fill("evenodd");
    triRibbon(ctx,0,0,W,18); triRibbon(ctx,0,H-18,W,18);
    ctx.fillStyle="#C8102E"; ctx.fillRect(0,18,18,H-36); ctx.fillStyle="#007A3D"; ctx.fillRect(W-18,18,18,H-36);
    // badge
    const bw=W*0.72, bh = name?150:120, bx=(W-bw)/2, by=H-inset-bh/2-10;
    ctx.fillStyle="#C8102E"; roundRect(ctx,bx,by-bh/2,bw,bh,26); ctx.fill();
    ctx.fillStyle="#fff"; setDir(ctx,message);
    const f = fitText(ctx,message,bw*0.9,1,58,700,ar?kufi:taj);
    ctx.font=`700 ${f.size}px ${ar?kufi:taj}`; ctx.fillText(f.lines[0], W/2, name? by-22 : by);
    if(name){ ctx.font=`500 32px ${taj}`; setDir(ctx,name); ctx.fillStyle="#FFE3E8"; ctx.fillText(name, W/2, by+38); }
    ctx.fillStyle="#007A3D"; ctx.font=`700 30px ${ar?kufi:taj}`; const k=ar?T.natDay.ar:T.natDay.en; setDir(ctx,k);
    ctx.fillText(k, W/2, inset/2+6);
  }
  else { // corner sash
    // sash across the top corner (left in English, right in Arabic): white / red / green, red widest
    ctx.save();
    if(ar){ ctx.translate(W,0); ctx.rotate(Math.PI/4); } else { ctx.translate(0,0); ctx.rotate(-Math.PI/4); }
    const sy=170, sh=150, sx=-500, sw=1000;
    ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=24; ctx.shadowOffsetY=6;
    ctx.fillStyle="#C8102E"; ctx.fillRect(sx,sy,sw,sh); ctx.shadowColor="transparent";
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(sx,sy,sw,sh*0.22);
    ctx.fillStyle="#007A3D"; ctx.fillRect(sx,sy+sh*0.78,sw,sh*0.22);
    ctx.fillStyle="rgba(255,255,255,.55)"; ctx.fillRect(sx,sy+sh*0.22,sw,2); ctx.fillRect(sx,sy+sh*0.78-2,sw,2);
    ctx.fillStyle="#FFFFFF"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.direction = ar?"rtl":"ltr";
    ctx.font=`700 40px ${ar?kufi:taj}`; if(!ar) ctx.letterSpacing="4px";
    ctx.fillText(ar?"٢٠ نوفمبر":"20 NOVEMBER", 0, sy+sh/2+2);
    ctx.letterSpacing="0px"; ctx.restore();
    // bottom-left label
    const pad=40; ctx.font=`700 60px ${ar?kufi:taj}`;
    const f = fitText(ctx,message,W*0.7,2,64,700,ar?kufi:taj);
    const lh=f.size*1.3, h=f.lines.length*lh + (name?60:0) + 40, w=W*0.78;
    const x = ar ? W-pad-w : pad, y = H-pad-h;
    ctx.fillStyle="rgba(0,85,42,.9)"; roundRect(ctx,x,y,w,h,22); ctx.fill();
    ctx.fillStyle="#C8102E"; ctx.fillRect(ar? x+w-12 : x, y+18, 12, h-36);
    ctx.textAlign = ar ? "right" : "left"; setDir(ctx,message); ctx.fillStyle="#fff";
    const tx = ar ? x+w-40 : x+40;
    ctx.font=`700 ${f.size}px ${ar?kufi:taj}`;
    f.lines.forEach((l,i)=>ctx.fillText(l, tx, y+20+lh/2+i*lh));
    if(name){ ctx.font=`500 34px ${taj}`; setDir(ctx,name); ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText(name, tx, y+h-44); }
  }
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

$("#fFile").addEventListener("change", e => {
  const file = e.target.files[0]; if(!file) return;
  const img = new Image(); img.onload = () => { frame.img=img; frame.zoom=1; frame.ox=frame.oy=0; $("#fZoom").value=1; renderFrame(); };
  img.src = URL.createObjectURL(file);
});
$("#fZoom").addEventListener("input", e => { frame.zoom=+e.target.value; renderFrame(); });
(function dragSetup(){
  const cv = $("#frameCanvas"); let drag=null;
  cv.addEventListener("pointerdown", e => { if(!frame.img) return; drag={x:e.clientX,y:e.clientY,ox:frame.ox,oy:frame.oy}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(!drag) return; const k = cv.width / cv.getBoundingClientRect().width;
    frame.ox = drag.ox + (e.clientX-drag.x)*k; frame.oy = drag.oy + (e.clientY-drag.y)*k; renderFrame(); });
  cv.addEventListener("pointerup", ()=> drag=null); cv.addEventListener("pointercancel", ()=> drag=null);
})();

const yearLabel = e => e.yl ? e.yl[LANG] : (LANG==="ar" ? e.y.toLocaleString("ar-EG",{useGrouping:false}) : String(e.y));

function renderTimeline(){
  $("#timeline").innerHTML = EVENTS.map(e=>`
    <div class="ev${e.key?" key":""}"><span class="dot"></span>
      <div class="box"><div class="yr">${yearLabel(e)}</div><h3>${e.t[LANG]}</h3><p>${e.d[LANG]}</p></div>
    </div>`).join("");
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }), {threshold:.15}) : null;
  $$(".ev").forEach(el => io ? io.observe(el) : el.classList.add("in"));
}

const order = { set:[], picks:[], checked:false };
let perfectRounds = store.get("ond_order_perfect", 0);
function newOrderRound(){
  const pool = [...EVENTS].sort(()=>Math.random()-.5);
  // avoid near-identical years in one round so the answer is never ambiguous
  const chosen = [];
  for(const e of pool){ if(chosen.every(c => Math.abs(c.y-e.y) >= 5)) chosen.push(e); if(chosen.length===5) break; }
  order.set = chosen; order.picks = []; order.checked = false;
  renderOrder();
}
function renderOrder(){
  const toNum = n => LANG==="ar" ? n.toLocaleString("ar-EG") : n;
  const sorted = [...order.set].sort((a,b)=>a.y-b.y);
  $("#orderList").innerHTML = order.set.map((e,i)=>{
    const pos = order.picks.indexOf(i);
    let cls = pos>=0 ? " picked" : "";
    if(order.checked) cls += sorted[pos]===e ? " ok" : " bad";
    return `<button class="oitem${cls}" data-i="${i}" ${order.checked?"disabled":""}>
      <span class="badge">${pos>=0?toNum(pos+1):""}</span><span>${e.t[LANG]}</span><span class="yr">${yearLabel(e)}</span></button>`;
  }).join("");
  $$(".oitem").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, at = order.picks.indexOf(i);
    if(at>=0) order.picks.splice(at,1); else order.picks.push(i);
    $("#orderResult").textContent = ""; renderOrder();
  });
  $("#orderCheck").style.display = order.checked ? "none" : "";
  $("#orderBest").textContent = `${t("best")} ${toNum(perfectRounds)}`;
}
$("#orderCheck").onclick = () => {
  if(order.picks.length < 5){ $("#orderResult").style.color="var(--red)"; $("#orderResult").textContent = t("pickAll"); return; }
  order.checked = true;
  const sorted = [...order.set].sort((a,b)=>a.y-b.y);
  const right = order.picks.filter((i,pos)=> sorted[pos]===order.set[i]).length;
  const r = $("#orderResult");
  if(right===5){ perfectRounds++; store.set("ond_order_perfect", perfectRounds); r.style.color="var(--green)"; r.textContent=t("orderPerfect"); confetti(); }
  else { r.style.color="var(--ink)"; r.textContent = `${t("orderScore")} ${LANG==="ar"?right.toLocaleString("ar-EG"):right} / ${LANG==="ar"?"٥":"5"}`; }
  renderOrder();
};

/* one-time cleanup of local test data: bump to wipe on every device */
const QUIZ_DATA_VERSION = 2;
if(store.get("ond_quiz_version", 1) !== QUIZ_DATA_VERSION){
  try{ localStorage.removeItem("ond_board"); localStorage.removeItem("ond_attempt"); }catch(e){}
  store.set("ond_quiz_version", QUIZ_DATA_VERSION);
}
const QTIME = 20;
const quiz = { state:"start", set:[], i:0, score:0, correct:0, timer:null, left:QTIME, player:"", answered:false, token:null, busy:false };
const normName = n => n.trim().replace(/\s+/g," ").toLowerCase();
const num = n => LANG==="ar" ? Number(n).toLocaleString("ar-EG") : n;

/* ---------------------------------------------------------------------
   Score storage. Hosted (http/https): one shared leaderboard on the server.
   Opened as a local file: falls back to this browser only.
   --------------------------------------------------------------------- */
const ONLINE = location.protocol.startsWith("http");
const deviceId = (() => {
  let d = store.get("ond_device", null);
  if(!d){ d = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9-]/g,""); store.set("ond_device", d); }
  return d;
})();
const lb = { top:[], total:0, me:null, error:false };

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"});
  let data = {}; try{ data = await r.json(); }catch(e){}
  return {status:r.status, data};
}
const Local = {
  board(){ return store.get("ond_board", []); },
  save(b){ b.sort((x,y)=> y.s-x.s || x.at-y.at); store.set("ond_board", b); },
  summary(n){ const b=this.board(); const i=b.findIndex(r=>normName(r.n)===normName(n)); return i<0?null:{n:b[i].n, s:b[i].s, rank:i+1, total:b.length, final:b[i].final}; },
};
const Scores = {
  async load(){
    if(ONLINE){
      try{
        const {status, data} = await api(`/api/leaderboard?device=${encodeURIComponent(QUIZ_ONE_PER_DEVICE?deviceId:"")}`);
        if(status!==200) throw 0;
        Object.assign(lb, {top:data.top, total:data.total, me:data.me, error:false});
      }catch(e){ lb.error = true; }
    } else {
      const b = Local.board(), a = store.get("ond_attempt", null);
      Object.assign(lb, {top:b.slice(0,10), total:b.length, me: QUIZ_ONE_PER_DEVICE && a ? Local.summary(a.n) : null, error:false});
    }
  },
  async start(name){
    if(ONLINE){
      const {status, data} = await api("/api/start", {name, device: QUIZ_ONE_PER_DEVICE ? deviceId : ""});
      if(status===200) return {token:data.token};
      if(data.error==="device_played"){ lb.me = data.me; return {error:"played"}; }
      if(data.error==="name_taken") return {error:"taken"};
      return {error:"network"};
    }
    const b = Local.board();
    if(b.some(r=>normName(r.n)===normName(name))) return {error:"taken"};
    b.push({n:name, s:0, at:Date.now(), final:false}); Local.save(b);
    store.set("ond_attempt", {n:name});
    return {token:"local"};
  },
  // saves run one after another so they always reach the server in order
  progress(final){ this._q = (this._q || Promise.resolve()).then(() => this._progress(final)).catch(()=>{}); return this._q; },
  async _progress(final){
    if(ONLINE){
      for(let tries=0; tries<3; tries++){
        try{
          const {status, data} = await api("/api/score", {token:quiz.token, score:quiz.score, correct:quiz.correct, final});
          if(status===200){ lb.me = data.me; return; }
          if(status<500) return;
        }catch(e){}
        await new Promise(r=>setTimeout(r, 800*(tries+1)));
      }
      return;
    }
    const b = Local.board(), r = b.find(x=>normName(x.n)===normName(quiz.player));
    if(r){ r.s = quiz.score; r.final = !!final; if(final) r.at = Date.now(); Local.save(b); }
    lb.me = Local.summary(quiz.player);
  },
  async reset(){
    if(ONLINE){
      const key = prompt(t("adminKey")); if(!key) return false;
      const {status} = await api("/api/reset", {key});
      if(status!==200){ toast(t("adminWrong")); return false; }
      return true;
    }
    store.set("ond_board", []); try{ localStorage.removeItem("ond_attempt"); }catch(e){}
    return true;
  }
};

function renderBoard(){
  const mine = lb.me ? normName(lb.me.n) : null;
  const hi = ' style="border-color:var(--red);background:#FFF5F6"';
  const rows = lb.top.map((r,i)=>`<li${normName(r.n)===mine?hi:""}><span>${num(i+1)}. ${esc(r.n)}</span><b>${r.s}</b></li>`).join("");
  const extra = (lb.me && lb.me.rank > lb.top.length) ? `<li${hi}><span>${num(lb.me.rank)}. ${esc(lb.me.n)}</span><b>${lb.me.s}</b></li>` : "";
  $("#board").innerHTML = lb.error && !lb.top.length
    ? `<li class="empty" style="border:0;background:transparent;padding:0">${t("boardOffline")}</li>`
    : lb.total ? rows + extra : `<li class="empty" style="border:0;background:transparent;padding:0">${t("noScores")}</li>`;
  $("#boardCount").textContent = lb.total ? `${t("players")} ${num(lb.total)}` : "";
}

function renderQuiz(){
  const c = $("#quizCard");
  if(quiz.state==="start"){
    if(lb.me){ c.innerHTML = lockedView(lb.me); return; }
    c.innerHTML = `<div class="quiz-start">
      <div class="big">${num(10)}</div><p style="margin:8px 0 14px;color:var(--muted)">${t("quizSub")}</p>
      <p style="margin-bottom:16px;font-weight:700;color:var(--red);display:flex;gap:6px;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>${t("oneChance")}</p>
      <div class="field"><input type="text" id="qName" maxlength="24" placeholder="${t("yourName")}" value="${esc(quiz.player)}"></div>
      <p id="qErr" style="color:var(--red);font-weight:700;min-height:1.6em;margin:-6px 0 8px"></p>
      <button class="btn btn-red" id="qStart" style="width:100%">${t("start")}</button></div>`;
    $("#qStart").onclick = startQuiz;
    $("#qName").onkeydown = e => { if(e.key==="Enter") startQuiz(); };
    return;
  }
  if(quiz.state==="end"){
    const me = lb.me;
    c.innerHTML = `<div class="quiz-start">
      <p style="font-weight:700;color:var(--muted)">${t("resultTitle")}</p>
      <div class="big">${quiz.score}</div><p style="font-weight:700">${t("points")}</p>
      <p style="margin:10px 0 6px">${t("correctOf")} <bdi dir="ltr">${num(quiz.correct)} / ${num(10)}</bdi></p>
      ${me&&me.rank?`<p style="font-weight:700;color:var(--green);font-size:1.15rem">${t("yourRank")} <bdi dir="ltr">${num(me.rank)} / ${num(me.total)}</bdi></p>`:""}
      <p style="color:var(--muted);margin-top:14px">${t("finalNote")}</p></div>`;
    return;
  }
  const q = quiz.set[quiz.i];
  c.innerHTML = `
    <div class="q-top"><span>${t("question")} <bdi dir="ltr">${num(quiz.i+1)} / ${num(10)}</bdi></span><span>${quiz.score} ${t("points")}</span></div>
    <div class="timer"><i id="qBar"></i></div>
    <div class="q-text">${q.q[LANG]}</div>
    <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o[LANG]}</button>`).join("")}</div>
    <div class="explain" id="qExp"></div>
    <div class="q-foot"><button class="btn btn-green" id="qNext" style="visibility:hidden">${quiz.i===9?t("finish"):t("next")}</button></div>`;
  $$(".opt").forEach(b => b.onclick = () => answer(+b.dataset.j));
  $("#qNext").onclick = nextQ;
  if(quiz.answered) revealAnswer(quiz.lastPick, true);
  else $("#qBar").style.width = (quiz.left/QTIME*100)+"%";
}
async function startQuiz(){
  if(quiz.busy) return;
  const n = ($("#qName") ? $("#qName").value : "").trim().replace(/\s+/g," ");
  const err = $("#qErr");
  if(n.length < 2){ err.textContent = t("nameRequired"); $("#qName").focus(); return; }
  quiz.busy = true; $("#qStart").disabled = true; $("#qStart").textContent = "...";
  let r;
  try{ r = await Scores.start(n); }catch(e){ r = {error:"network"}; }
  quiz.busy = false;
  if(r.error){
    if(r.error==="played"){ await Scores.load(); renderBoard(); renderQuiz(); return; }
    renderQuiz(); $("#qName").value = n;
    $("#qErr").textContent = r.error==="taken" ? t("nameTaken") : t("netError");
    return;
  }
  quiz.token = r.token; quiz.player = n;
  quiz.set = [...QUESTIONS].sort(()=>Math.random()-.5).slice(0,10);
  quiz.i=0; quiz.score=0; quiz.correct=0; quiz.state="play";
  beginQ();
  Scores.load().then(renderBoard);
}
function beginQ(){
  quiz.left = QTIME; quiz.answered=false; quiz.lastPick=null; renderQuiz();
  clearInterval(quiz.timer);
  quiz.timer = setInterval(()=>{
    quiz.left -= 0.1;
    const bar = $("#qBar");
    if(bar){ bar.style.width = Math.max(0,quiz.left/QTIME*100)+"%"; bar.style.background = quiz.left<5 ? "var(--red)" : "var(--green)"; }
    if(quiz.left<=0){ clearInterval(quiz.timer); answer(-1); }
  },100);
}
function answer(j){
  if(quiz.answered) return;
  clearInterval(quiz.timer); quiz.answered=true; quiz.lastPick=j;
  const q = quiz.set[quiz.i];
  if(j===q.a){ quiz.correct++; quiz.score += 50 + Math.round(Math.max(0,quiz.left)/QTIME*50); }
  Scores.progress(false);
  revealAnswer(j);
}
function revealAnswer(j, silent){
  const q = quiz.set[quiz.i];
  $$(".opt").forEach((b,k)=>{ b.disabled=true; if(k===q.a) b.classList.add("right"); else if(k===j) b.classList.add("wrong"); });
  const e=$("#qExp"); e.innerHTML = (j===-1?`<b>${t("timeUp")}</b> `:"") + q.e[LANG]; e.classList.add("show");
  $("#qNext").style.visibility="visible";
  const top = $(".q-top span:last-child"); if(top) top.textContent = `${quiz.score} ${t("points")}`;
}
async function nextQ(){
  if(quiz.i<9){ quiz.i++; beginQ(); return; }
  $("#qNext").disabled = true;
  await Scores.progress(true);
  quiz.state="end";
  await Scores.load(); renderBoard(); renderQuiz();
  if(quiz.correct>=7) confetti();
}
/* keep the shared leaderboard live */
async function refreshBoard(){ await Scores.load(); renderBoard(); if(quiz.state==="start") renderQuiz(); }
refreshBoard();
if(ONLINE) setInterval(()=>{ if(!document.hidden && quiz.state!=="play") refreshBoard(); }, 20000);

/* organiser reset: open the page with ?admin in the URL */
if(/[?&]admin\b/.test(location.search)){
  const b = $("#adminReset"); b.style.display="inline-flex";
  b.onclick = async () => { if(!confirm(t("resetConfirm"))) return;
    if(!(await Scores.reset())) return;
    lb.me = null; quiz.state="start"; quiz.player=""; await refreshBoard(); toast(t("resetDone")); };
}

/* =====================================================================
   6. WISH WALL
   ===================================================================== */
/* one-time cleanup of local wishes: bump to wipe on every device */
const WISH_DATA_VERSION = 2;
if(store.get("ond_wish_version", 1) !== WISH_DATA_VERSION){
  try{ localStorage.removeItem("ond_wishes"); localStorage.removeItem("ond_liked"); }catch(e){}
  store.set("ond_wish_version", WISH_DATA_VERSION);
}
/* Hosted: one shared wall for everyone. Local file: this browser only (with samples). */
let wishes = ONLINE ? [] : (store.get("ond_wishes", null) || SEED_WISHES.map((w,i)=>({...w, id:"s"+i})));
let liked = ONLINE ? [] : store.get("ond_liked", []);
const ADMIN = /[?&]admin\b/.test(location.search);
let adminKey = null;

async function loadWishes(){
  if(!ONLINE) return;
  try{
    const {status, data} = await api(`/api/wishes?device=${encodeURIComponent(deviceId)}`);
    if(status!==200) return;
    wishes = data.wishes; liked = wishes.filter(w=>w.me).map(w=>w.id);
    renderWishes();
  }catch(e){}
}
/* wishes posted on this device before the wall became shared are uploaded once */
async function migrateLocalWishes(){
  if(!ONLINE || store.get("ond_wish_migrated", false)) return;
  const old = (store.get("ond_wishes", []) || []).filter(w => String(w.id).startsWith("w")).reverse();
  for(const w of old){ try{ await api("/api/wishes", {name:w.n, text:w.w, device:deviceId}); }catch(e){} }
  store.set("ond_wish_migrated", true);
  try{ localStorage.removeItem("ond_wishes"); localStorage.removeItem("ond_liked"); }catch(e){}
  if(old.length) loadWishes();
}
function renderWishes(){
  $("#wishList").innerHTML = wishes.length ? wishes.map(w=>`
    <div class="wish" dir="${isAr(w.w)?"rtl":"ltr"}">
      <p>${esc(w.w)}</p>
      <footer><span>${esc(w.n)}</span>
      <span style="display:flex;gap:6px;align-items:center">
      ${ADMIN&&ONLINE?`<button class="like del" data-id="${esc(w.id)}" aria-label="delete" style="color:var(--muted)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>`:""}
      <button class="like lk" data-id="${esc(w.id)}" aria-label="like"><svg viewBox="0 0 24 24" fill="${liked.includes(w.id)?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.4-9.3-9C1.2 8.8 3.3 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.7 0 5.8 3.8 4.3 7-2.3 4.6-9.3 9-9.3 9z"/></svg>${w.l}</button>
      </span></footer>
    </div>`).join("")
    : `<p style="color:var(--muted);text-align:center;padding:30px 0">${t("noWishes")}</p>`;
  $$(".lk").forEach(b => b.onclick = async () => {
    const w = wishes.find(x=>x.id===b.dataset.id); if(!w) return;
    const was = liked.includes(w.id);
    // update instantly, then confirm with the server
    if(was){ liked = liked.filter(x=>x!==w.id); w.l = Math.max(0,w.l-1); } else { liked.push(w.id); w.l++; }
    renderWishes();
    if(!ONLINE){ store.set("ond_wishes", wishes); store.set("ond_liked", liked); return; }
    try{ const {status, data} = await api("/api/wish-like", {id:w.id, device:deviceId});
      if(status===200){ w.l = data.l; liked = data.me ? [...new Set([...liked, w.id])] : liked.filter(x=>x!==w.id); renderWishes(); } }catch(e){}
  });
  $$(".del").forEach(b => b.onclick = async () => {
    if(!adminKey) adminKey = prompt(t("adminKey")); if(!adminKey) return;
    if(!confirm(t("deleteWish"))) return;
    const {status} = await api("/api/wish-delete", {id:b.dataset.id, key:adminKey});
    if(status===403){ adminKey=null; toast(t("adminWrong")); return; }
    wishes = wishes.filter(w=>w.id!==b.dataset.id); renderWishes(); toast(t("wishDeleted"));
  });
}
$("#wishForm").onsubmit = async e => {
  e.preventDefault();
  const n=$("#wName").value.trim(), w=$("#wText").value.trim(); if(!n||!w) return;
  if(n.length<2){ toast(t("wishNameShort")); $("#wName").focus(); return; }
  if(w.length<3){ toast(t("wishShort")); $("#wText").focus(); return; }
  if(!ONLINE){
    wishes.unshift({n, w, l:0, id:"w"+Date.now()});
    store.set("ond_wishes", wishes); $("#wText").value=""; renderWishes(); toast(t("posted")); return;
  }
  const btn = $("#wishForm button"); btn.disabled = true;
  try{
    const {status, data} = await api("/api/wishes", {name:n, text:w, device:deviceId});
    if(status===200){ wishes.unshift(data.wish); $("#wText").value=""; renderWishes(); toast(t("posted")); }
    else toast(t({no_links:"wishNoLinks", slow_down:"wishSlow", too_short:"wishShort"}[data.error] || "netError"));
  }catch(err){ toast(t("netError")); }
  btn.disabled = false;
};
if(ONLINE){
  migrateLocalWishes().then(loadWishes);
  setInterval(()=>{ if(!document.hidden) loadWishes(); }, 20000);
}
let pTimer=null, pIdx=0;
function showPresentWish(){
  const w = wishes[pIdx % wishes.length]; if(!w) return;
  const q=$("#pText"), who=$("#pWho");
  q.style.opacity=0; who.style.opacity=0;
  setTimeout(()=>{ q.textContent = "«"+w.w+"»"; q.dir = isAr(w.w)?"rtl":"ltr"; who.textContent = "— "+w.n; q.style.opacity=1; who.style.opacity=.8; }, 500);
  pIdx++;
}
$("#presentBtn").onclick = () => {
  $("#present").classList.add("open"); pIdx=0; showPresentWish(); pTimer=setInterval(showPresentWish, 7000);
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
};
function closePresent(){ $("#present").classList.remove("open"); clearInterval(pTimer); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
$("#presentClose").onclick = closePresent;
// Safari uses Esc to leave fullscreen and never passes the key to the page,
// so close display mode whenever fullscreen ends.
["fullscreenchange","webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => {
  if(!(document.fullscreenElement || document.webkitFullscreenElement) && $("#present").classList.contains("open")){
    $("#present").classList.remove("open"); clearInterval(pTimer);
  }
}));
document.addEventListener("keydown", e => { if(e.key==="Escape"){ closePresent(); $("#lightbox").classList.remove("open"); } });

/* =====================================================================
   LANGUAGE + INIT
   ===================================================================== */
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==="ar"?"rtl":"ltr";
  document.title = t("brandTitle");
  $$("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  $("#langBtn").textContent = LANG==="ar" ? "EN" : "عربي";
  $("#busaidiImg").alt = $("#lightImg").alt = t("spotAlt");
  $("#cTo").placeholder = LANG==="ar"?"مثال: أمي":"e.g. Mum";
  $("#cFrom").placeholder = LANG==="ar"?"اسمك":"Your name";
  $("#cCustom").placeholder = LANG==="ar"?"عبارتك هنا":"Your words here";
  $("#fName").placeholder = LANG==="ar"?"اسمك (اختياري)":"Your name (optional)";
  $("#wName").placeholder = t("wNamePh"); $("#wText").placeholder = t("wTextPh");
  fillMsgSelect($("#cMsg"), true); fillMsgSelect($("#fMsg"), false);
  renderThumbs(); renderCard(); renderFrame(); renderTimeline(); renderOrder(); renderBoard(); renderWishes(); renderQuiz(); showFact();
}
$("#langBtn").onclick = () => {
  LANG = LANG==="ar"?"en":"ar"; try{ localStorage.setItem("ond_lang", LANG); }catch(e){}
  $("#cMsg").value=""; $("#fMsg").value="";
  applyLang();
};

["#cMsg","#cCustom","#cTo","#cFrom"].forEach(s => $(s).addEventListener("input", renderCard));
$("#cMsg").addEventListener("change", renderCard);
$$("#cFormat .chip").forEach(b => b.onclick = () => { $$("#cFormat .chip").forEach(x=>x.classList.remove("on")); b.classList.add("on"); cardState.fmt=b.dataset.v; renderCard(); });
$$("#fStyle .chip").forEach(b => b.onclick = () => { $$("#fStyle .chip").forEach(x=>x.classList.remove("on")); b.classList.add("on"); frame.style=b.dataset.v; frame.ox=frame.oy=0; renderFrame(); });
["#fName","#fMsg"].forEach(s => $(s).addEventListener("input", renderFrame));
$("#fMsg").addEventListener("change", renderFrame);
const shareText = () => LANG==="ar" ? "كل عام وعُمان بخير — العيد الوطني العُماني ٢٠ نوفمبر" : "Happy Oman National Day — 20 November";
$("#cDownload").onclick = () => downloadCanvas($("#cardCanvas"), "national-day-card.png");
$("#cShare").onclick = () => shareCanvas($("#cardCanvas"), "national-day-card.png", shareText());
$("#fDownload").onclick = () => { if(!frame.img) return toast(t("noPhoto")); downloadCanvas($("#frameCanvas"), "national-day-photo.png"); };
$("#fShare").onclick = () => { if(!frame.img) return toast(t("noPhoto")); shareCanvas($("#frameCanvas"), "national-day-photo.png", shareText()); };

tick();
applyLang();
// redraw canvases once web fonts are ready (canvas can't use them before)
document.fonts && document.fonts.ready.then(()=>{
  Promise.all(['700 40px "Reem Kufi"','500 40px "Reem Kufi"','700 40px "Tajawal"','500 40px "Tajawal"'].map(f=>document.fonts.load(f)))
    .finally(()=>{ renderThumbs(); renderCard(); renderFrame(); });
});
